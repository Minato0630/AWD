<!DOCTYPE html>
<html>
<head>
<title>Student Detail</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
.detail-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.detail-card h2 { color: #333; }
.detail-card p { margin: 10px 0; }
.back-link { display: block; text-align: center; margin-top: 20px; }
.back-link a { padding: 10px 20px; background-color: #2196F3; color: white; text-decoration: none; border-radius: 5px; }
</style>
</head>
<body>
<div id="detail-card" class="detail-card">
<h2>Student Detail</h2>
<p id="detail-id"></p>
<p id="detail-name"></p>
<p id="detail-email"></p>
<p id="detail-phone"></p>
<p id="detail-address"></p>
</div>
<div class="back-link">
<a href="index.html">Back to Form</a>
</div>
<script src="js/main.js"></script>
</body>
</html>
