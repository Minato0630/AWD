<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, 
initial-scale=1.0"> 
<title>Registration Form</title>
<style>/* Global Settings */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

/* Background */
body {
    background: linear-gradient(135deg, #0b57dc, #044085);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Form Container */
form {
    background: #ffffff;
    padding: 35px 40px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    animation: slideDown 0.6s ease;
}

/* Animation */
@keyframes slideDown {
    from {
        transform: translateY(-40px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Header */
h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #fff;
    font-size: 35px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    position: absolute;
    top: 40px;
}

/* Labels */
label {
    font-weight: 600;
    color: #333;
}

/* Input Fields */
input {
    width: 100%;
    padding: 10px 12px;
    margin: 8px 0 18px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

/* Input Focus Effect */
input:focus {
    border-color: #0d1e3a;
    outline: none;
    box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #2575fc;
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.4s;
}

/* Hover Effect */
button:hover {
    background: #044085;
    transform: scale(1.03);
}
</style>

</head>
<body> 
<h1>Register</h1> 
<form action="/register" method="POST"> 
<label for="name">Name:</label> 
<input type="text" id="name" name="name" required> 
<br> 
<label for="email">Email:</label> 
<input type="email" id="email" name="email" required> 
<br> 
<label for="password">Password:</label> 
<input type="password" id="password" name="password" 
required> 
<br> 
<label for="className">Class:</label> 
<input type="text" id="className" name="className" 
required> 
<br> 
<label for="rollNo">Roll Number:</label> 
<input type="text" id="rollNo" name="rollNo" required> 
<br> 
<button type="submit">Register</button>
</form>
</body>

</html>
