<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Student Web App</title> 
<style> 
body { font-family: Arial, sans-serif; text-align: center; padding: 50px; 
background-color: #f4f4f9; } 
form { display: inline-block; text-align: left; padding: 20px; background: white; 
border: 1px solid 
#ddd; border-radius: 5px; } 
input, select, button { margin: 10px 0; padding: 10px; font-size: 16px; width: 
100%; } 
button { background-color: #af4c53; color: white; border: none; cursor: pointer; 
} 
button:hover { background-color: hsl(238, 69%, 28%); } 
</style> 
</head> 
<body> 
<h1>Welcome to the Student Web Application!</h1> 
<form method="POST" action="/greet"> 
<input type="text" name="name" placeholder="Your Name" required /><br> 
<input type="text" name="mobile" placeholder="Mobile Number" required 
/><br> 
<input type="email" name="email" placeholder="Email" required /><br> 
<input type="text" name="address" placeholder="Address" required /><br> 
<select name="gender" required> 
<option value="">Select Gender</option> 
<option value="Male">Male</option> 
<option value="Female">Female</option> 
<option value="Other">Other</option> 
</select><br> 
<button type="submit">Submit</button> 
</form> 
</body> 
</html>
